services:
  # 1. FastAPI Backend API
  - type: web
    name: cardly-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cardly-postgres
          property: connectionString
      - key: APP_NAME
        value: Cardly API
      - key: FRONTEND_ORIGINS
        value: https://cardly-web.onrender.com,http://localhost:5173

  # 2. React Vite Frontend (Static Site with SPA Routing)
  - type: web
    name: cardly-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cardly-api
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: cardly-postgres
    databaseName: card_game_tracker
    user: cardly
    plan: free
