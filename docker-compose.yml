version: "3.8"

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: cardly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-card_game_tracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 6

  # FastAPI Backend API Service (Runs migrations & starts server)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardly-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@db:5432/${POSTGRES_DB:-card_game_tracker}
      APP_NAME: Cardly - Card Game Tracker API
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:80,http://localhost
      PORT: 8000
    ports:
      - "8000:8000"

  # Nginx Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: cardly-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
    name: cardly_postgres_data
